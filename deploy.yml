
name: Deploy to production

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Never run two deployments simultaneously
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_PATH: /home/projects/geographical-games
  SERVICE_NAME: geographical-games

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Linux Server
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT }}
          command_timeout: 20m
          command_timeout: 20m

          script: |
            set -Eeuo pipefail

            DEPLOY_PATH="/home/projects/geographical-games"
            SERVICE_NAME="geographical-games"

            echo "=================================="
            echo "Starting deployment"
            echo "=================================="

            # Restore GitLab Nginx even if deployment fails
            restart_nginx() {
              echo "Starting GitLab Nginx..."
              sudo gitlab-ctl start nginx
            }

            trap restart_nginx EXIT

            # Stop GitLab Nginx
            echo "Stopping GitLab Nginx..."
            sudo gitlab-ctl stop nginx

            # Navigate to project
            cd "$DEPLOY_PATH"

            # Update source code
            echo "Updating source code..."
            git fetch origin main
            git reset --hard origin/main

            # Load NVM if installed
            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
            fi

            echo "Node version:"
            node --version

            echo "NPM version:"
            npm --version

            # Install dependencies
            echo "Installing dependencies..."
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            # Build application
            echo "Building application..."
            npm run build

            # Restart application using Systemd
            echo "Restarting application..."
            sudo systemctl restart "$SERVICE_NAME"

            # Verify application status
            echo "Checking application status..."
            sleep 3

            sudo systemctl is-active --quiet "$SERVICE_NAME"

            echo "=================================="
            echo "Deployment completed successfully"
            echo "=================================="
