# Nginx server block for the public documentation site.
# NOT installed automatically. Review, adapt the certificate paths, and
# install by hand (docs/RELEASE_PROCESS.md, "First deployment"). On this
# server Nginx is GitLab's bundled one: include this file through
# nginx['custom_nginx_config'] in /etc/gitlab/gitlab.rb, then
# `sudo gitlab-ctl reconfigure` (or test with `sudo gitlab-ctl nginx -t`
# if available). It does not touch the game's server block.
#
# Requires: DNS A record docs.geoaigames.joocha.com -> the game server, and
# a TLS certificate that covers docs.geoaigames.joocha.com (the current
# certificate does not).

server {
    listen 80;
    listen [::]:80;
    server_name docs.geoaigames.joocha.com;

    # Keep this if certificates are issued with the webroot method.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.geoaigames.joocha.com;

    ssl_certificate     /etc/letsencrypt/live/docs.geoaigames.joocha.com/fullchain.pem;   # adapt
    ssl_certificate_key /etc/letsencrypt/live/docs.geoaigames.joocha.com/privkey.pem;     # adapt

    # A symlink to the active build; switched atomically by docs.js publish.
    root /home/projects/geoaigames-docs/current;
    index index.html;
    charset utf-8;
    disable_symlinks off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # /latest/scoring-system -> scoring-system.html (same as `docs preview`).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Raw Markdown and JSON for AI agents and other tools: readable from any
    # origin, revalidated so a new release is picked up at once.
    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/(data/.*\.json|llms\.txt|.*search-index\.json|.*docs-index\.json)$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~ /\. { deny all; }

    error_page 404 /404.html;
}
