<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Atlas Quest</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ===== CONFIG: change after you create your bot ===== */
:root{
  /* Colors follow the Telegram theme automatically; fallbacks are used in a normal browser. */
  --bg:var(--tg-theme-bg-color,#ffffff);
  --bg2:var(--tg-theme-secondary-bg-color,#eef3f5);
  --text:var(--tg-theme-text-color,#10242a);
  --hint:var(--tg-theme-hint-color,#6b8088);
  --accent:var(--tg-theme-button-color,#2a8bd6);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --sea:color-mix(in srgb,var(--accent) 12%,var(--bg2));
  --land:var(--bg);
  --edge:color-mix(in srgb,var(--text) 28%,transparent);
  --hl:#ffb21e; --good:#1fa463; --bad:#e2484f;
}
@media (prefers-color-scheme:dark){:root{
  --bg:var(--tg-theme-bg-color,#17212b);--bg2:var(--tg-theme-secondary-bg-color,#0e1621);
  --text:var(--tg-theme-text-color,#f1f5f7);--hint:var(--tg-theme-hint-color,#7f919c);
  --accent:var(--tg-theme-button-color,#5ea9e6);--accent-text:var(--tg-theme-button-text-color,#ffffff);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none}
body{height:var(--tg-viewport-stable-height,100%);display:flex;flex-direction:column;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.pad{padding:14px max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

/* start */
.start{justify-content:space-between;gap:16px}
.start .map{flex:1;min-height:180px;border-radius:16px}
.hello{color:var(--hint);font-size:15px}
h1{margin:2px 0 6px;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.sub{margin:0;color:var(--hint)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg2);padding:4px;border-radius:12px}
.seg button{background:transparent;padding:10px;border-radius:9px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.best{display:flex;justify-content:space-between;color:var(--hint);font-size:14px}
.cta{width:100%;background:var(--accent);color:var(--accent-text);padding:15px;border-radius:12px;font-weight:700;font-size:17px}
.cta:active{opacity:.85}

/* game */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
.dots{display:flex;gap:4px;flex:1}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--bg2)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.now{background:var(--accent)}
.pts{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.streak{background:var(--hl);color:#2a1a00;border-radius:999px;padding:2px 9px;font-size:13px;font-weight:700}
.map{position:relative;flex:1;min-height:0;background:var(--sea);overflow:hidden}
.map svg{display:block;width:100%;height:100%;touch-action:manipulation}
.map .sea{fill:var(--sea)}
.map path.c{fill:var(--land);stroke:var(--edge);stroke-width:.7;transition:fill .25s}
.map.tap path.c{cursor:pointer}
.map path.c.hl{fill:var(--hl)}
.map path.c.good{fill:var(--good)}
.map path.c.bad{fill:var(--bad)}
.map path.c.dim{fill:color-mix(in srgb,var(--land) 70%,var(--sea))}
.map text{font-weight:700;fill:var(--text);stroke:var(--bg);paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.bottom{padding:12px max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--hint);font-weight:600}
.prompt{font-size:21px;font-weight:700;line-height:1.2}
.prompt b{color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:var(--bg2);border:2px solid transparent;border-radius:12px;padding:12px 10px;font-weight:600;font-size:15px;min-height:52px;text-align:center}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--bg2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--bg2))}
.fb{display:flex;align-items:center;gap:12px}
.fb p{margin:0;flex:1;font-weight:600}
.fb p.ok{color:var(--good)}.fb p.no{color:var(--bad)}
.fb .cta{width:auto;padding:12px 20px;font-size:16px}
.hint{color:var(--hint);font-size:14px;margin:0}

/* result */
.result{justify-content:center;gap:18px;text-align:center}
.big{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.03em}
.big small{font-size:26px;color:var(--hint);font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row div{background:var(--bg2);border-radius:12px;padding:10px 6px}
.row b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.row span{font-size:12px;color:var(--hint)}
.ghost{width:100%;background:var(--bg2);padding:14px;border-radius:12px;font-weight:700}
.newbest{color:var(--good);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- START -->
<section class="screen start pad" id="sStart">
  <div>
    <div class="hello" id="hello">Hi, explorer!</div>
    <h1>Atlas Quest</h1>
    <p class="sub">Find countries on the map and name them by their shape. 10 rounds.</p>
  </div>
  <div class="map" id="startMap"></div>
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="seg" id="level">
      <button data-l="easy" class="on">Easy · big countries</button>
      <button data-l="hard">Hard · all countries</button>
    </div>
    <div class="best"><span>Best score</span><span id="bestTxt">—</span></div>
    <button class="cta" id="play">Play</button>
  </div>
</section>

<!-- GAME -->
<section class="screen" id="sGame" hidden>
  <div class="top"><div class="dots" id="dots"></div><span class="streak" id="streak" hidden></span><span class="pts" id="pts">0</span></div>
  <div class="map" id="gameMap"></div>
  <div class="bottom" id="bottom"></div>
</section>

<!-- RESULT -->
<section class="screen result pad" id="sResult" hidden></section>

<script>
/* ===== CONFIG ===== */
const GAME_LINK = "https://t.me/YOUR_BOT_USERNAME/play"; // your Mini App link, used by the Share button
const ROUNDS = 10;

/* ===== TELEGRAM ===== */
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
const inTG = !!(tg && tg.platform && tg.platform !== "unknown");
if(tg){try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();tg.setHeaderColor&&tg.setHeaderColor("bg_color")}catch(e){}}
const haptic=(t)=>{try{if(!inTG)return;if(t==="tap")tg.HapticFeedback.impactOccurred("light");else tg.HapticFeedback.notificationOccurred(t)}catch(e){}};
const canCloud=()=>inTG&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9");
const store={
  get(k){return new Promise(res=>{if(canCloud()){tg.CloudStorage.getItem(k,(err,v)=>res(err?null:v))}else{try{res(localStorage.getItem(k))}catch(e){res(null)}}})},
  set(k,v){if(canCloud()){tg.CloudStorage.setItem(k,String(v))}else{try{localStorage.setItem(k,String(v))}catch(e){}}}
};

/* ===== MAP DATA ===== */
const MAP = /*MAPDATA*/;
const S=1000/360;
const byName={};MAP.forEach(c=>{byName[c.name]=c;c.cx=(c.b[0]+c.b[2])/2;c.cy=(c.b[1]+c.b[3])/2;c.area=(c.b[2]-c.b[0])*(c.b[3]-c.b[1])});
byName["Russia"].b=[560,30,1000,140];byName["Russia"].cx=760;byName["Russia"].cy=95;
const SKIP=new Set(["Western Sahara","Palestine","Taiwan","Kosovo","Greenland","Falkland Islands","French Southern Lands","New Caledonia","Puerto Rico","Fiji","Antarctica"]);
const ALL=MAP.filter(c=>!SKIP.has(c.name)&&(c.b[2]-c.b[0])>2.5).map(c=>c.name);
const EASY=ALL.slice().sort((a,b)=>byName[b].area-byName[a].area).slice(0,75);
const rnd=n=>Math.floor(Math.random()*n),shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function nearest(n,k){const c=byName[n];return ALL.filter(x=>x!==n).map(x=>[x,Math.hypot(byName[x].cx-c.cx,byName[x].cy-c.cy)]).sort((a,b)=>a[1]-b[1]).slice(0,k).map(x=>x[0])}

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let PATHS="";MAP.forEach(c=>PATHS+=`<path class="c" data-n="${esc(c.name)}" d="${c.d}" vector-effect="non-scaling-stroke"/>`);
function makeMap(host,onTap){
  const NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");
  svg.innerHTML=`<rect class="sea" x="-3000" y="-2000" width="7000" height="5000"/><g>${PATHS}</g><g class="over"></g>`;
  host.appendChild(svg);
  const els={};svg.querySelectorAll("path.c").forEach(p=>els[p.dataset.n]=p);
  const over=svg.querySelector(".over");let vb=[0,0,1000,500],anim,labels=[];
  const apply=()=>{svg.setAttribute("viewBox",vb.join(" "));labels.forEach(t=>{t.setAttribute("font-size",vb[2]*.045);t.setAttribute("stroke-width",vb[2]*.012)})};
  if(onTap)svg.addEventListener("click",e=>{const p=e.target.closest&&e.target.closest("path.c");if(p)onTap(p.dataset.n)});
  const api={
    view(b,instant){ // fit box to the element's own aspect ratio
      const r=host.getBoundingClientRect(),ar=r.width&&r.height?r.width/r.height:1.6;
      let w=b[2]-b[0],h=b[3]-b[1];const cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;if(w/h<ar)w=h*ar;else h=w/ar;
      const to=[cx-w/2,cy-h/2,w,h];cancelAnimationFrame(anim);
      if(instant||reduce){vb=to;apply();return}
      const from=vb.slice(),t0=performance.now();
      const step=t=>{let k=Math.min(1,(t-t0)/650);k=1-Math.pow(1-k,3);vb=from.map((v,i)=>v+(to[i]-v)*k);apply();if(k<1)anim=requestAnimationFrame(step)};
      anim=requestAnimationFrame(step)},
    fit(names,pad=1.25,minW=120){let b=[1e9,1e9,-1e9,-1e9];names.forEach(n=>{const c=byName[n].b;b=[Math.min(b[0],c[0]),Math.min(b[1],c[1]),Math.max(b[2],c[2]),Math.max(b[3],c[3])]});
      const w=Math.max((b[2]-b[0])*pad,minW),h=Math.max((b[3]-b[1])*pad,minW/2),cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;api.view([cx-w/2,cy-h/2,cx+w/2,cy+h/2])},
    world(i){api.view([0,20,1000,420],i)},
    clear(){Object.values(els).forEach(p=>p.setAttribute("class","c"));over.innerHTML="";labels=[]},
    paint(ns,cls){ns.forEach(n=>{const p=els[n];if(p){p.classList.add(cls);p.parentNode.appendChild(p)}})},
    label(n){const c=byName[n];const t=document.createElementNS(NS,"text");t.textContent=n;t.setAttribute("x",c.cx);t.setAttribute("y",c.cy);t.setAttribute("text-anchor","middle");t.setAttribute("dominant-baseline","middle");over.appendChild(t);labels.push(t);apply()}
  };
  return api;
}

/* ===== START SCREEN ===== */
const $=id=>document.getElementById(id);
const startMap=makeMap($("startMap"));
let level="easy",best={easy:null,hard:null},spotT;
const name=inTG&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name;
if(name)$("hello").textContent=`Hi, ${name}!`;
function showBest(){const b=best[level];$("bestTxt").textContent=b==null?"Not played yet":`${b} points`}
$("level").onclick=e=>{const b=e.target.closest("button");if(!b)return;level=b.dataset.l;haptic("tap");
  $("level").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));showBest()};
function spotlight(){const n=EASY[rnd(EASY.length)];startMap.clear();startMap.paint([n],"hl");startMap.fit([n,...nearest(n,6)],1.3,220);startMap.label(n)}
function show(id){["sStart","sGame","sResult"].forEach(s=>$(s).hidden=s!==id);
  if(inTG){try{id==="sGame"?tg.BackButton.show():tg.BackButton.hide()}catch(e){}}}
if(inTG){try{tg.BackButton.onClick(()=>{haptic("tap");goStart()})}catch(e){}}
function goStart(){show("sStart");spotlight();clearInterval(spotT);spotT=setInterval(spotlight,2500);showBest()}
$("play").onclick=()=>{haptic("tap");startGame()};

/* ===== GAME ===== */
const gameMap=makeMap($("gameMap"),n=>tapCountry(n));
let G;
function startGame(){
  clearInterval(spotT);
  const pool=shuffle(level==="easy"?EASY:ALL).slice(0,ROUNDS);
  G={qs:pool.map((n,i)=>({n,type:i%2?"name":"find"})),i:0,score:0,correct:0,streak:0,bestStreak:0,res:[]};
  show("sGame");requestAnimationFrame(renderQ);
}
function header(){
  $("dots").innerHTML=G.qs.map((_,i)=>`<i class="${G.res[i]===true?"ok":G.res[i]===false?"no":i===G.i?"now":""}"></i>`).join("");
  $("pts").textContent=G.score;$("streak").hidden=G.streak<2;$("streak").textContent=`🔥 ${G.streak}`;
}
function renderQ(){
  const q=G.qs[G.i];G.locked=false;header();gameMap.clear();
  const near=nearest(q.n,level==="easy"?4:6);
  q.region=[q.n,...shuffle(near).slice(0,3+rnd(2))];
  $("gameMap").classList.toggle("tap",q.type==="find");
  if(q.type==="find"){
    gameMap.fit(q.region,1.35,level==="easy"?160:110);
    $("bottom").innerHTML=`<div class="kind">Round ${G.i+1} · Find it</div><div class="prompt">Tap <b>${esc(q.n)}</b> on the map</div><p class="hint">Zoomed to the right area. Which shape is it?</p>`;
  }else{
    gameMap.paint([q.n],"hl");gameMap.fit(q.region,1.6,level==="easy"?200:140);
    const opts=shuffle([q.n,...shuffle(near).slice(0,3)]);
    $("bottom").innerHTML=`<div class="kind">Round ${G.i+1} · Name it</div><div class="prompt">Which country is highlighted?</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    $("bottom").querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickOption(b));
  }
}
function tapCountry(n){
  const q=G&&G.qs[G.i];if(!q||G.locked||q.type!=="find"||$("sGame").hidden)return;
  settle(n===q.n,n);
}
function pickOption(btn){
  const q=G.qs[G.i];if(G.locked)return;
  $("bottom").querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.o===q.n)b.classList.add("right")});
  if(btn.dataset.o!==q.n)btn.classList.add("wrong");
  settle(btn.dataset.o===q.n,btn.dataset.o);
}
function settle(ok,chosen){
  const q=G.qs[G.i];G.locked=true;let gain=0;
  if(ok){G.streak++;G.correct++;gain=100+Math.min(50,(G.streak-1)*10);G.score+=gain;G.bestStreak=Math.max(G.bestStreak,G.streak);haptic("success")}
  else{G.streak=0;haptic("error")}
  G.res[G.i]=ok;header();
  $("gameMap").classList.remove("tap");
  if(q.type==="name")gameMap.clear();
  gameMap.paint([q.n],"good");gameMap.label(q.n);
  if(!ok&&q.type==="find"){gameMap.paint([chosen],"bad");gameMap.label(chosen)}
  const msg=ok?`Correct! +${gain}`:q.type==="find"?`That's ${chosen}.`:`It's ${q.n}.`;
  const last=G.i===G.qs.length-1;
  const fb=document.createElement("div");fb.className="fb";
  fb.innerHTML=`<p class="${ok?"ok":"no"}">${esc(msg)}</p><button class="cta" id="next">${last?"Results":"Next"}</button>`;
  const hint=$("bottom").querySelector(".hint");if(hint)hint.remove();
  $("bottom").appendChild(fb);
  $("next").onclick=()=>{haptic("tap");G.i++;G.i>=G.qs.length?finish():renderQ()};
}

/* ===== RESULT ===== */
function finish(){
  const isBest=best[level]==null||G.score>best[level];
  if(isBest){best[level]=G.score;store.set("best_"+level,G.score)}
  const msg=G.correct>=9?"Map master!":G.correct>=7?"Great explorer!":G.correct>=5?"Good trip!":"The world is big. Try again!";
  $("sResult").innerHTML=`
    <div class="hint">${level==="easy"?"Easy":"Hard"} mode</div>
    <div class="big">${G.correct}<small> / ${ROUNDS}</small></div>
    <div style="font-size:20px;font-weight:700">${msg}</div>
    ${isBest?`<div class="newbest">New best score!</div>`:""}
    <div class="row"><div><b>${G.score}</b><span>points</span></div><div><b>${G.bestStreak}</b><span>best streak</span></div><div><b>${best[level]}</b><span>best ever</span></div></div>
    <button class="cta" id="again">Play again</button>
    <button class="ghost" id="share">Challenge a friend</button>
    <button class="ghost" id="menu">Menu</button>`;
  show("sResult");
  $("again").onclick=()=>{haptic("tap");startGame()};
  $("menu").onclick=()=>{haptic("tap");goStart()};
  $("share").onclick=()=>{
    const text=`I found ${G.correct}/${ROUNDS} countries (${G.score} pts) in Atlas Quest. Can you beat me?`;
    const url=`https://t.me/share/url?url=${encodeURIComponent(GAME_LINK)}&text=${encodeURIComponent(text)}`;
    if(inTG)tg.openTelegramLink(url);else window.open(url,"_blank");
  };
}

/* ===== BOOT ===== */
Promise.all([store.get("best_easy"),store.get("best_hard")]).then(([e,h])=>{
  best.easy=e?+e:null;best.hard=h?+h:null;goStart()});

</script>
</body>
</html>
