
name: Deploy to production

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Never run two deployments simultaneously
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Linux Server
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT }}
          command_timeout: 20m

          script: |
            set -Eeuo pipefail

            DEPLOY_PATH="/home/projects/geographical-games"
            BACKEND_PATH="$DEPLOY_PATH/backend"
            SERVICE_NAME="geography-game-api"
            HEALTH_URL="http://127.0.0.1:3020/api/health"

            echo "=================================="
            echo "Starting deployment"
            echo "=================================="

            # Restore Nginx even if deployment fails
            restart_nginx() {
              echo "Starting Nginx..."
              sudo systemctl start nginx
            }

            trap restart_nginx EXIT

            # Stop Nginx
            echo "Stopping Nginx..."
            sudo systemctl stop nginx

            # Navigate to project
            cd "$DEPLOY_PATH"

            # Update source code (frontend is static and served as-is)
            echo "Updating source code..."
            git fetch origin main
            git reset --hard origin/main

            # Load NVM if installed (nvm.sh is not compatible with `set -u`)
            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              set +u
              source "$NVM_DIR/nvm.sh"
              set -u
            fi

            echo "Node version:"
            node --version

            echo "NPM version:"
            npm --version

            # Install backend dependencies (no build step: plain Node.js)
            echo "Installing backend dependencies..."
            cd "$BACKEND_PATH"

            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi

            # The systemd service is installed manually by an administrator
            # (see backend/README.md). Until then, skip the restart.
            if ! systemctl cat "$SERVICE_NAME" >/dev/null 2>&1; then
              echo "WARNING: $SERVICE_NAME.service is not installed; skipping API restart."
              echo "Frontend deployed. See backend/README.md to install the service."
              exit 0
            fi

            # Restart API using systemd
            echo "Restarting $SERVICE_NAME..."
            sudo systemctl restart "$SERVICE_NAME"

            # Verify the service is running and answering on loopback
            echo "Checking API health..."
            for attempt in $(seq 1 10); do
              if curl -fsS "$HEALTH_URL" >/dev/null; then
                echo "API is healthy."
                break
              fi

              if [ "$attempt" -eq 10 ]; then
                echo "ERROR: API did not become healthy."
                sudo systemctl status "$SERVICE_NAME" --no-pager || true
                sudo journalctl -u "$SERVICE_NAME" -n 50 --no-pager || true
                exit 1
              fi

              sleep 2
            done

            sudo systemctl is-active --quiet "$SERVICE_NAME"

            echo "=================================="
            echo "Deployment completed successfully"
            echo "=================================="
